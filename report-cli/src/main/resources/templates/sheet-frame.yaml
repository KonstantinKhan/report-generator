# Minimal sheet template: A4 portrait sheet with the GOST frame. Edit and re-run:
#   ./gradlew :report-cli:runTemplate -Pargs="path/to/your.yaml output"
# Units: mm. Axes: x right, y down, origin = sheet top-left. Full schema: docs/wiki/template-yaml.md
name: sheet-frame

sheet:
  format: A3                # A4|A3|A2|A1|A0, or `width:` + `height:` instead
  orientation: landscape     # portrait|landscape
  margins: { left: 20, top: 5, right: 5, bottom: 5 }   # defines the content area (anchors sheet.content*)

blocksets:
  organizationSet:
    blocks:
      - id: organization
        type: rect
        size: { width: 50, height: 15 }
        thickness: thick
  parametersSet:
    blocks:
      - id: parameters
        type: table
        columns: [ 5, 5, 5 , 17, 18 ]
        rows:
          - height: 5
            cells:
              - { text: "Лит.", span: 3, align: center }
              - { text: "Масса", align: center }
              - { text: "Масштаб", align: center }
          - height: 5
            cells:
              - ~
              - ~
              - ~
              - ~
              - ~
  nameSet:
    blocks:
      - id: name
        type: rect
        size: { width: 70, height: 25 }
        thickness: thick
  designationSet:
    blocks:
      - id: designation
        type: rect
        size: { width: 120, height: 15 }
        thickness: thick
  signSet:
    blocks:
      - id: sign
        type: table
        columns: [ 7, 10, 23, 15, 10 ]
        rows:
          - height: 5
            cells: [ { borders: { bottom: thin } }, { borders: { bottom: thin } },{ borders: { bottom: thin } },{ borders: { bottom: thin } },{ borders: { bottom: thin } }, ]
          - height: 5
            cells: [ { borders: { top: thin } },{ borders: { top: thin } },{ borders: { top: thin } },{ borders: { top: thin } },{ borders: { top: thin } }, ]
          - height: 5
            cells:
              - { text: "Изм", align: center }
              - { text: "Лист", align: center }
              - { text: "№ докум.", align: center }
              - { text: "Подп.", align: center }
              - { text: "Дата", align: center }
          - height: 5
            cells:
              - { text: "Разраб.", span: 2, borders: { bottom: thin } }
              - { borders: { bottom: thin } }
              - { borders: { bottom: thin } }
              - { borders: { bottom: thin } }
          - height: 5
            cells:
              - { text: "Пров.", span: 2, borders: { bottom: thin, top: thin } }
              - { borders: { bottom: thin, top: thin } }
              - { borders: { bottom: thin, top: thin } }
              - { borders: { bottom: thin, top: thin } }
          - height: 5
            cells:
              - { span: 2, borders: { bottom: thin, top: thin } }
              - { borders: { bottom: thin, top: thin } }
              - { borders: { bottom: thin, top: thin } }
              - { borders: { bottom: thin, top: thin } }
          - height: 5
            cells:
              - { text: "Н. контр.", span: 2, borders: { bottom: thin, top: thin } }
              - { borders: { bottom: thin, top: thin } }
              - { borders: { bottom: thin, top: thin } }
              - { borders: { bottom: thin, top: thin } }
          - height: 5
            cells:
              - { text: "Утв.", span: 2, borders: { top: thin } }
              - { borders: { top: thin } }
              - { borders: { top: thin } }
              - { borders: { top: thin } }
  mainInscriptionSet:
    blocks:
      - { id: organization, use: organizationSet }
      - id: parameters
        use: parametersSet
        attach: { self: bottomRight, to: organization.topRight }
      - id: name
        use: nameSet
        attach: { self: bottomRight, to: organization.bottomLeft }
      - id: designation
        use: designationSet
        attach: { self: bottomRight, to: parameters.topRight }
      - id: sign
        use: signSet
        attach: { self: bottomRight, to: name.bottomLeft }

  bottomLeftTableSet:
    blocks:
      - id: bottomLeftTable
        type: table
        rotate: 90
        columns: [ 25, 35, 25, 25, 35 ]
        rows:
          - height: 5
            cells:
              - { text: "Инв. № подл.", align: center }
              - { text: "Подп. и дата", align: center }
              - { text: "Взам. инв. №", align: center }
              - { text: "Инв. № дубл.", align: center }
              - { text: "Подп. и дата", align: center }
          - height: 5
            cells: [ ~,~,~,~,~ ]
  topLeftTableSet:
    blocks:
      - id: topLeftTable
        type: table
        rotate: 90
        columns: [ 60, 60 ]
        rows:
          - height: 5
            cells:
              - { text: "Справ. №", align: center }
              - { text: "Перв. примен.", align: center }
          - height: 7
            cells: [ ~, ~ ]
blocks:
  # frame nested into the content area: 210-20-5 = 185 wide, 297-5-5 = 287 high
  - id: frame
    type: frame             # frame (default thick) | rect (default thin) | table | text | flow
    thickness: thick        # thin (0.25) | thick (0.71) | number in mm
    size: { width: 395, height: 287 }
    # Привязка: точка `self` этого блока ставится в точку `to` (+ необязательный offset {x, y} в мм, оси листа).
    #
    # self — якоря самого блока (у любого блока считаются автоматически от его size):
    #   topLeft      topCenter      topRight
    #   middleLeft   center         middleRight
    #   bottomLeft   bottomCenter   bottomRight
    #
    # to — формат `id.якорь`, где id: `sheet` (лист) или id другого блока:
    #   sheet.<9 стандартных якорей>      углы, середины сторон и центр ПОЛНОГО листа (без учёта margins)
    #                                     sheet.topLeft, sheet.topCenter, sheet.topRight,
    #                                     sheet.middleLeft, sheet.center, sheet.middleRight,
    #                                     sheet.bottomLeft, sheet.bottomCenter, sheet.bottomRight
    #   sheet.contentTopLeft              4 угла области внутри полей (лист минус margins)
    #   sheet.contentTopRight
    #   sheet.contentBottomLeft
    #   sheet.contentBottomRight
    #   sheet.<имя>                       свои точки из `sheet.anchors` (мм от левого верхнего угла листа)
    #   <idБлока>.<9 стандартных якорей>  якоря другого блока, например frame.bottomRight
    #   <idТаблицы>.col[i].left|right     у таблиц ещё: границы колонок и рядов, ячейки (индексы с 0):
    #   <idТаблицы>.row[j].top|bottom       stamp.col[1].left, stamp.row[0].bottom,
    #   <idТаблицы>.cell[r,c].<якорь>       stamp.cell[2,3].topLeft
    #
    # Раздельно по осям (из якоря берётся только нужная координата, offset здесь число):
    #   attach:
    #     x: {self: topLeft,    to: a.topRight,    offset: 3}
    #     y: {self: bottomLeft, to: c.bottomLeft,  offset: -1}
    attach: { self: topLeft, to: sheet.contentTopLeft }
  - id: mainInscription
    use: mainInscriptionSet
    when: first
    attach: { self: bottomRight, to: frame.bottomRight }
  - id: bottomLeftTable
    use: bottomLeftTableSet
    attach: { self: bottomRight, to: frame.bottomLeft }
  - id: topLeftTable
    use: topLeftTableSet
    attach: { self: topRight, to: frame.topLeft}
