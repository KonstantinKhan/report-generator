# Experiment template: frame + table (spans, rotated cell, per-side borders) + text blocks.
name: table-demo

sheet:
  format: A4
  orientation: portrait
  margins: {left: 20, top: 5, right: 5, bottom: 5}

blocks:
  - id: frame
    type: frame
    size: {width: 185, height: 287}
    attach: {self: topLeft, to: sheet.contentTopLeft}

  # stamp in the bottom-right corner of the frame
  - id: stamp
    type: table
    columns: [10, 10, 25, 20, 15, 105]     # column widths
    rows:
      - height: 15
        cells:
          - {text: "Rev", rotate: 90, align: center}    # rotate: 90 = text reads bottom to top
          - "Sheet"                                    # scalar = plain text
          - "Doc no."
          - "Sign"
          - "Date"
          - {bind: "${doc.designation}", align: center, fontSize: 14}   # ${...} from the data context
      - height: 8
        cells:
          - ~                                           # ~ = empty cell
          - {text: "page", borders: {top: thin}}        # only listed sides override, rest thick
          - {bind: "${page.number}", align: center}
          - {text: "R-aligned", align: right, borders: thin}
          - "Date"
          - {bind: "${doc.name}", borders: {left: none}}
    attach: {self: bottomRight, to: frame.bottomRight}

  # vertical table hanging off the left of the frame (table rotated 90 degrees)
  - id: side
    type: table
    rotate: 90
    columns: [30, 30]
    rows:
      - height: 7
        cells: ["Inv. no.", "Sign"]
    attach: {self: topRight, to: frame.topLeft}

  # free text blocks
  - id: title
    type: text
    text: "Table demo"
    size: {width: 100, height: 10}
    fontSize: 20
    align: center
    attach: {self: topCenter, to: frame.topCenter, offset: {x: 0, y: 20}}

  # typed binds: Decimal with a format, Date with a format, and an optional bind without a value (renders empty)
  - id: mass
    type: text
    bind: "${doc.mass}"
    format: {pattern: "0.00 'kg'", locale: ru, rounding: HALF_UP}
    size: {width: 100, height: 6}
    attach: {self: topLeft, to: title.bottomLeft, offset: {x: 0, y: 5}}

  - id: issued
    type: text
    bind: "${doc.issued}"
    format: {pattern: "dd.MM.yyyy"}
    size: {width: 100, height: 6}
    attach: {self: topLeft, to: mass.bottomLeft}

  - id: approvedBy
    type: text
    bind: "${doc.approvedBy}"
    optional: true                # declared in the schema, no value in the demo data -> empty
    size: {width: 100, height: 6}
    attach: {self: topLeft, to: issued.bottomLeft}

  - id: box
    type: rect
    thickness: thin
    size: {width: 60, height: 30}
    attach: {self: topLeft, to: approvedBy.bottomLeft, offset: {x: 0, y: 5}}
