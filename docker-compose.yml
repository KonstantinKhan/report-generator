name: report-generator

services:
  report-server:
    image: report-server
    build: .
    ports:
      # Сервис доступен только с этого компьютера, не из локальной сети.
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    environment:
      LOODSMAN_BASE_URL: ${LOODSMAN_BASE_URL:?LOODSMAN_BASE_URL is required, set it in .env}
      LOODSMAN_DB_NAME: ${LOODSMAN_DB_NAME:?LOODSMAN_DB_NAME is required, set it in .env}
      LOODSMAN_USERNAME: ${LOODSMAN_USERNAME:?LOODSMAN_USERNAME is required, set it in .env}
      LOODSMAN_PASSWORD: ${LOODSMAN_PASSWORD:?LOODSMAN_PASSWORD is required, set it in .env}
      REPORT_OUTPUT_DIR: /data/reports
      SERVER_PORT: 8080
      LOODSMAN_DEBUG: ${LOODSMAN_DEBUG:-}
    volumes:
      - ./output/reports:/data/reports
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
