kinds:
  Деталь: PART
  Сборочная единица: ASSEMBLY
  Сборочный чертеж: ASSEMBLY_DRAWING
  Комплекс: COMPLEX
  Стандартное изделие: STANDARD
  Прочее изделие: OTHER
  Материал по КД: MATERIAL
  Комплект: KIT
  Спецификация: SPECIFICATION
  Чертеж детали: DETAIL_DRAWING

relations:
  - link: "Состоит из ..."
    as: COMPOSITION
    from: [Сборочная единица]
  - link: "Документы"
    as: DOCUMENT
    from:
      - Сборочная единица
      - Деталь
      - Прочее изделие
  - link: "Технологическая ДСЕ для"
    direction: INVERSE
    from: [Деталь]
    as: TECHNOLOGICAL_PART

requiredRelations:
  - COMPOSITION
  - DOCUMENT

attributes:
  designation:
    name: Обозначение
  name:
    name: Наименование
  mass:
    name: Масса
  companyName:
    byKind:
      ASSEMBLY: Наименование предприятия
      PART: Наименование предприятия
  format:
    byKind:
      SPECIFICATION: Формат
      DETAIL_DRAWING: Формат
      ASSEMBLY_DRAWING: Формат

properties:
  version: VERSION
  state: STATE

link:
  fields:
    quantityMin: MIN_QUANTITY
    quantityMax: MAX_QUANTITY
    unit: UNIT
  attributes:
    position:
      - relation: COMPOSITION
        name: Позиция
    note:
      - relation: COMPOSITION
        name: Примечание

onUnmapped:
  kind: KEEP
  relation: SKIP
