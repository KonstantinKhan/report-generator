kinds:
  Деталь: PART
  Сборочная единица: ASSEMBLY
  Сборочный чертеж: ASSEMBLY_DRAWING
  Комплекс: COMPLEX
  Стандартное изделие: STANDARD
  Прочее изделие: OTHER
  Материал по КД: MATERIAL
  Комплект: KIT
  Спецификация: SPECIFICATION
  Чертеж детали: DETAIL_DRAWING
  Форма материала: MATERIAL_FORM
  Комплект документов: DOCUMENT_SET
  Ведомость эксплуатационных документов: OPERATIONAL_DOCUMENTS_LIST

relations:
  - link: "Состоит из ..."
    as: COMPOSITION
    from:
      - Сборочная единица
      - Комплект
  - link: "Документы"
    as: DOCUMENT
    from:
      - Сборочная единица
      - Деталь
      - Прочее изделие
      - Комплект
      - Комплект документов
  - link: "Технологическая ДСЕ для"
    direction: INVERSE
    from: [Деталь]
    as: TECHNOLOGICAL_PART
  - link: "Изготавливается из ..."
    as: MADE_FROM
    from: [Форма материала]
  # Исполнения: FORWARD от основного исполнения к остальным (обратное имя «Базовое исполнение», id 7).
  # from = Сборочная единица: ПРЕДПОЛОЖЕНИЕ, id типа в types-links не проверен на сервере (см. wiki).
  - link: "Исполнения"
    as: VARIANT
    from: [Сборочная единица]

requiredRelations:
  - COMPOSITION
  - DOCUMENT

attributes:
  designation:
    name: Обозначение
  productDesignation:
    byKind:
      STANDARD: Обозначение изделия
      OTHER: Обозначение изделия
  name:
    name: Наименование
    byKind:
      OPERATIONAL_DOCUMENTS_LIST: Наименование изделия
  mass:
    name: Масса
  companyName:
    byKind:
      ASSEMBLY: Наименование предприятия
      PART: Наименование предприятия
  format:
    byKind:
      SPECIFICATION: Формат
      DETAIL_DRAWING: Формат
      ASSEMBLY_DRAWING: Формат
      OPERATIONAL_DOCUMENTS_LIST: Формат
  materialKind:
    byKind:
      MATERIAL: Вид материала по ЕСКД
  standardDesignation:
    byKind:
      STANDARD: Обозначение стандарта
      OTHER: Обозначение стандарта
  productVariety:
    byKind:
      STANDARD: Вид изделия
      OTHER: Вид изделия
  sizeType:
    byKind:
      STANDARD: Типоразмер
      OTHER: Типоразмер

properties:
  version: VERSION
  state: STATE

link:
  fields:
    quantityMin: MIN_QUANTITY
    quantityMax: MAX_QUANTITY
    unit: UNIT
  attributes:
    position:
      - relation: COMPOSITION
        name: Позиция
    note:
      - relation: COMPOSITION
        name: Примечание
    zone:
      - relation: COMPOSITION
        name: Зона
    applicationMethod:
      - relation: COMPOSITION
        name: Способ применения
    kitPurpose:
      - relation: COMPOSITION
        name: Назначение комплекта

onUnmapped:
  kind: KEEP
  relation: SKIP
